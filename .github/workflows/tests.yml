name: CPU checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.23.5 Pillow==11.0.0 lmdb==1.7.3 safetensors==0.6.2 albumentations==1.3.1 opencv-python-headless==4.10.0.84 scikit-image==0.24.0 imageio==2.37.0 tqdm==4.67.1 -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
